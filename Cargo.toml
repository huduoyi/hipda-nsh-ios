[package]
name = "hipda-nsh"
version = "0.1.0"
edition = "2024"
publish = false
description = "HiPDA·nsh 版 —— HiPDA 论坛非官方客户端（官方 NSH + Rust）"

[workspace]
members = ["crates/forum-core"]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
forum-core = { path = "crates/forum-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[dev-dependencies]
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
